name: EPCMS CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Invariant Test & E2E Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Shared Package
        run: npm run build -w packages/shared

      - name: Type Check Backend Server
        run: npx tsc --noEmit --project apps/server/tsconfig.json

      - name: Run Backend Invariant Test Suite (Vitest)
        run: npm run test -w apps/server

      - name: Type Check & Build Frontend Client (Vite)
        run: npm run build -w apps/client

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite
        run: npm run test:e2e -w apps/client
